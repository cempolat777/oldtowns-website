name: Daily Video Health Check

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  video-health:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run video health check
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node ./check-video-health.mjs

      - name: Commit health cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/data/videos.json video-health-report.json

          if [ -d "src/data/health-backups" ]; then
            git add src/data/health-backups
          fi

          if git diff --cached --quiet; then
            echo "No video changes detected."
            exit 0
          fi

          git commit -m "chore: daily video health cleanup"
          git push